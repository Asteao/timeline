<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Custom slider zoom control, with the + / - buttons
       inside the bar at each end. -->
  <div class="zoom-slider">
    <div class="slider-track" id="zoom-track" role="slider" tabindex="0" aria-label="Zoom level" aria-valuemin="0" aria-valuemax="127" aria-valuenow="0" aria-valuetext="1.0x">
      <div class="slider-fill" aria-hidden="true"></div>
      <button id="zoom-out" type="button" aria-label="Zoom out">-</button>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <div class="slider-thumb" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Minimap: a second copy of the timeline without labels, fixed
       to the top of the page (left in portrait), with a box showing
       the part currently in view. The dots, bars and viewport box
       are filled in by app.js. -->
  <div class="minimap" aria-hidden="true">
    <div class="minimap-track">
      <div class="minimap-line"></div>
      <div class="minimap-viewport"></div>
    </div>
  </div>

  <div class="timeline-pad" aria-hidden="true"></div>
  <div class="timeline-track">
    <div class="timeline-line" aria-hidden="true"></div>
  </div>
  <div class="timeline-pad" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
