<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline</title>
  <style>
    /* No overscroll navigation: without this, scrolling past the left
       end of the timeline on a Mac trackpad makes Chrome swipe back
       to the previous page. */
    html,
    body {
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      background: #fff;
      min-height: 100vh;
      display: flex;
      align-items: safe center;
      justify-content: safe center;
      overflow: auto;
    }

    /* Custom slider zoom control, fixed at the bottom centre.
       No range input: the bar is a div, thick and rounded at both ends,
       outlined with a thin light-grey line. The value indicator is a
       thin white circle, the same size as the bar, with a thin
       light-grey outline, and the part of the bar behind it fills with
       semi-transparent light grey as the slider moves.
       --frac (0 to 1) positions both. */
    .zoom-slider {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .slider-track {
      position: relative;
      width: 80vw;
      height: 48px;
      border: 1px solid #bbb;
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      overflow: hidden;
    }

    .slider-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: calc(var(--frac, 0) * (100% - 48px) + 24px);
      background: rgba(187, 187, 187, 0.35);
      z-index: 0;
    }

    /* + / - buttons inside the bar, one at each end. They sit above
       the fill and below the thumb, so at 1x the thumb covers the -
       button (and at 128x it covers the + button) — in both cases the
       covered button is the disabled one. */
    .slider-track button {
      position: absolute;
      top: 0;
      width: 48px;
      height: 48px;
      padding: 0;
      font-size: 1.5rem;
      line-height: 1;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 1;
    }

    .slider-track button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #zoom-out {
      left: 0;
    }

    #zoom-in {
      right: 0;
    }

    .slider-thumb {
      position: absolute;
      top: 0;
      left: calc(var(--frac, 0) * (100% - 48px));
      width: 48px;
      height: 48px;
      box-sizing: border-box;
      border-radius: 50%;
      border: 1px solid #bbb;
      background: #fff;
      z-index: 2;
    }

    .timeline-track {
      position: relative;
      /* No shrinking: the track is a flex item of body, and the default
         flex-shrink: 1 squeezed a zoomed track back to the viewport width,
         so zoom past the first step had no visible effect. */
      flex: 0 0 auto;
    }

    /* Fixed padding at both ends of the timeline, in viewport units so
       it does not grow with zoom. These are real elements, not margins:
       a trailing margin is dropped from the scrollable area, so the
       far end used to sit flush against the screen edge when zoomed in.
       At 1x the pads (10vw each) plus the track (80%) are exactly the
       viewport width, so the 1x look is unchanged. */
    .timeline-pad {
      flex: 0 0 auto;
    }

    .timeline-line {
      background: #000;
    }

    .event-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #000;
      /* Dots render on top of bars but are not interactive, so clicks
         pass through to the bar beneath instead of landing on a dot
         and doing nothing. */
      pointer-events: none;
    }

    .event-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
    }

    /* An event with an end is a dot stretched into a bar: same 12px
       thickness and black fill, with the white centre stretched into
       a stripe. Bars are drawn first, so dots render on top of them. */
    .event-bar {
      position: absolute;
      border-radius: 999px;
      background: #000;
      cursor: pointer;
    }

    .event-bar::after {
      content: '';
      position: absolute;
      border-radius: 999px;
      background: #fff;
    }

    /* Labels for events: a small box floating above or below the line
       (left or right of it in portrait), with the event title and the
       first few words of its description. A short stem joins the box
       to its dot or bar. Labels are placed only where they fit; see
       layoutLabels. */
    .event-label {
      position: absolute;
      max-width: 180px;
      padding: 4px 8px;
      background: #fff;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.35;
      pointer-events: none;
      z-index: 1;
    }

    .event-label::after {
      content: '';
      position: absolute;
      background: #bbb;
    }

    .event-label-title {
      font-weight: 600;
    }

    .event-label-excerpt {
      color: #555;
    }

    /* Wider than tall: horizontal line, dots and bars positioned left to right. */
    @media (orientation: landscape) {
      body {
        flex-direction: row;
      }

      .timeline-pad {
        width: 10vw;
        height: 12px;
      }

      .timeline-track {
        width: calc(80% * var(--zoom, 1));
        height: 12px;
        display: flex;
        align-items: center;
      }

      .timeline-line {
        width: 100%;
        height: 2px;
      }

      .event-dot {
        left: var(--pos);
        top: 50%;
        transform: translate(-50%, -50%);
      }

      .event-bar {
        left: var(--pos);
        width: calc(var(--end-pos) - var(--pos));
        height: 12px;
        top: 50%;
        transform: translateY(-50%);
      }

      .event-bar::after {
        height: 6px;
        left: 6px;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
      }

      .event-label {
        left: var(--pos);
        transform: translateX(-50%);
      }

      .event-label.label-above {
        bottom: calc(100% + 8px);
      }

      .event-label.label-above::after {
        left: 50%;
        top: 100%;
        width: 1px;
        height: 8px;
      }

      .event-label.label-below {
        top: calc(100% + 8px);
      }

      .event-label.label-below::after {
        left: 50%;
        bottom: 100%;
        width: 1px;
        height: 8px;
      }
    }

    /* Taller than wide: vertical line, dots and bars positioned top to bottom. */
    @media (orientation: portrait) {
      body {
        flex-direction: column;
      }

      .timeline-pad {
        width: 12px;
        height: 10vh;
      }

      .timeline-track {
        width: 12px;
        height: calc(80vh * var(--zoom, 1));
        display: flex;
        justify-content: center;
      }

      .timeline-line {
        width: 2px;
        height: 100%;
      }

      .event-dot {
        top: var(--pos);
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .event-bar {
        top: var(--pos);
        height: calc(var(--end-pos) - var(--pos));
        width: 12px;
        left: 50%;
        transform: translateX(-50%);
      }

      .event-bar::after {
        width: 6px;
        top: 6px;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
      }

      /* Above/below the line means left/right of it here. */
      .event-label {
        top: var(--pos);
        transform: translateY(-50%);
      }

      .event-label.label-above {
        right: calc(100% + 8px);
      }

      .event-label.label-above::after {
        top: 50%;
        left: 100%;
        width: 8px;
        height: 1px;
      }

      .event-label.label-below {
        left: calc(100% + 8px);
      }

      .event-label.label-below::after {
        top: 50%;
        right: 100%;
        width: 8px;
        height: 1px;
      }
    }
  </style>
</head>
<body>
  <!-- Custom slider zoom control, with the + / - buttons
       inside the bar at each end. -->
  <div class="zoom-slider">
    <div class="slider-track" id="zoom-track" role="slider" tabindex="0" aria-label="Zoom level" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0" aria-valuetext="1x">
      <div class="slider-fill" aria-hidden="true"></div>
      <button id="zoom-out" type="button" aria-label="Zoom out">-</button>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <div class="slider-thumb" aria-hidden="true"></div>
    </div>
  </div>

  <div class="timeline-pad" aria-hidden="true"></div>
  <div class="timeline-track">
    <div class="timeline-line" aria-hidden="true"></div>
  </div>
  <div class="timeline-pad" aria-hidden="true"></div>

  <script>
    // Relative so a branch preview loads its own copy of the timeline
    // instead of the one on the live site.
    const TIMELINE_URL = 'timelines/starship-flight-15.json';

    let timeline = null;

    async function fetchTimeline(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Failed to fetch timeline: ${response.status}`);
      }

      const data = await response.json();

      if (data.schema_version !== 1 || !Array.isArray(data.events)) {
        throw new Error('Not a timeline file (expected schema_version 1 and an events array).');
      }

      return data;
    }

    const track = document.querySelector('.timeline-track');

    let zoom = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 128;

    // Events and the fraction along the track their label anchors to:
    // a dot's position, or a bar's midpoint. Declared here, before
    // syncZoomUI runs at load, because syncZoomUI now re-lays out
    // the labels; declaring it next to drawEvents meant the load-time
    // call hit the variable before it existed and the whole script
    // died before the timeline loaded.
    let labelTargets = [];

    const zoomInButton = document.getElementById('zoom-in');
    const zoomOutButton = document.getElementById('zoom-out');
    const zoomTrack = document.getElementById('zoom-track');

    function syncZoomUI() {
      const step = Math.log2(zoom);
      zoomInButton.disabled = zoom >= MAX_ZOOM;
      zoomOutButton.disabled = zoom <= MIN_ZOOM;
      zoomTrack.style.setProperty('--frac', String(step / 7));
      zoomTrack.setAttribute('aria-valuenow', String(step));
      zoomTrack.setAttribute('aria-valuetext', `${zoom}x`);
      console.log('Zoom:', `${zoom}x`);
      layoutLabels();
    }

    // Zoom, keeping the timeline point under `anchor` (client coordinates)
    // in the same place on screen. Without an anchor the viewport centre
    // is used, so buttons, slider and keyboard zoom into the middle.
    // The point's fraction along the track is measured before the zoom
    // and the page is scrolled afterwards so that same fraction sits
    // under the anchor again. window.scrollTo clamps at the ends, so
    // an anchor outside the track (e.g. over the end padding) drifts
    // slightly instead of scrolling past the end.
    function setZoom(newZoom, anchor = { x: window.innerWidth / 2, y: window.innerHeight / 2 }) {
      const oldZoom = zoom;
      const clamped = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newZoom));
      if (clamped === oldZoom) {
        return;
      }

      const rect = track.getBoundingClientRect();
      const fx = rect.width ? (anchor.x - rect.left) / rect.width : 0.5;
      const fy = rect.height ? (anchor.y - rect.top) / rect.height : 0.5;

      zoom = clamped;
      track.style.setProperty('--zoom', zoom);
      syncZoomUI();

      const newRect = track.getBoundingClientRect();
      const newScrollX = rect.left + window.scrollX - anchor.x + fx * newRect.width;
      const newScrollY = rect.top + window.scrollY - anchor.y + fy * newRect.height;
      window.scrollTo(newScrollX, newScrollY);
    }

    function zoomIn(anchor) {
      setZoom(zoom * 2, anchor);
    }

    function zoomOut(anchor) {
      setZoom(zoom / 2, anchor);
    }

    // Clicking a duration event's bar snaps the zoom and scroll so
    // the event spans the page: the largest zoom step (powers of two,
    // 1x-128x) at which the event still fits inside the viewport,
    // with the event centred. A short event therefore fills less of
    // the page at the top step than a long one does.
    function zoomToEvent(startFrac, endFrac) {
      const landscape = window.matchMedia('(orientation: landscape)').matches;
      const span = endFrac - startFrac;
      const step = Math.min(7, Math.max(0, Math.floor(Math.log2(1 / (0.8 * span)))));
      setZoom(2 ** step);

      const rect = track.getBoundingClientRect();
      const trackLength = landscape ? rect.width : rect.height;
      const mid = ((startFrac + endFrac) / 2) * trackLength;
      if (landscape) {
        window.scrollTo(rect.left + window.scrollX + mid - window.innerWidth / 2, window.scrollY);
      } else {
        window.scrollTo(window.scrollX, rect.top + window.scrollY + mid - window.innerHeight / 2);
      }
    }

    // Baseline method: + / - buttons, now inside the slider bar.
    // Their pointerdown must not reach the slider track, or pressing
    // - would jump the zoom to 1x instead of stepping down one level.
    zoomInButton.addEventListener('click', () => zoomIn());
    zoomOutButton.addEventListener('click', () => zoomOut());
    for (const button of [zoomInButton, zoomOutButton]) {
      button.addEventListener('pointerdown', (event) => event.stopPropagation());
    }

    // Custom slider, log scale, one step per notch (1x to 128x).
    // Click or drag on the bar to set the zoom; arrow keys work when
    // the bar has focus.
    function sliderStepFromEvent(event) {
      const rect = zoomTrack.getBoundingClientRect();
      const frac = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
      return Math.round(frac * 7);
    }

    let sliderDragging = false;

    zoomTrack.addEventListener('pointerdown', (event) => {
      sliderDragging = true;
      zoomTrack.setPointerCapture(event.pointerId);
      setZoom(2 ** sliderStepFromEvent(event));
    });

    zoomTrack.addEventListener('pointermove', (event) => {
      if (sliderDragging) {
        setZoom(2 ** sliderStepFromEvent(event));
      }
    });

    zoomTrack.addEventListener('pointerup', () => {
      sliderDragging = false;
    });

    zoomTrack.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight' || event.key === 'ArrowUp') {
        event.preventDefault();
        zoomIn();
      } else if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') {
        event.preventDefault();
        zoomOut();
      } else if (event.key === 'Home') {
        event.preventDefault();
        setZoom(1);
      } else if (event.key === 'End') {
        event.preventDefault();
        setZoom(MAX_ZOOM);
      }
    });

    // Scroll up to zoom in, scroll down to zoom out.
    // A mostly-horizontal swipe is panning, so it is left alone.
    // Wheel events arrive in small increments on a trackpad, so they
    // are accumulated until they add up to one step.
    let wheelAccum = 0;
    window.addEventListener('wheel', (event) => {
      if (Math.abs(event.deltaX) > Math.abs(event.deltaY)) {
        return;
      }
      event.preventDefault();
      wheelAccum += event.deltaY;
      const anchor = { x: event.clientX, y: event.clientY };
      if (wheelAccum <= -100) {
        zoomIn(anchor);
        wheelAccum = 0;
      } else if (wheelAccum >= 100) {
        zoomOut(anchor);
        wheelAccum = 0;
      }
    }, { passive: false });

    // Keyboard: + / - to zoom, 0 to reset.
    window.addEventListener('keydown', (event) => {
      if (event.key === '+' || event.key === '=') {
        zoomIn();
      } else if (event.key === '-' || event.key === '_') {
        zoomOut();
      } else if (event.key === '0') {
        setZoom(1);
      }
    });

    // Double-click the timeline to zoom in,
    // Shift+double-click to zoom out.
    track.addEventListener('dblclick', (event) => {
      const anchor = { x: event.clientX, y: event.clientY };
      if (event.shiftKey) {
        zoomOut(anchor);
      } else {
        zoomIn(anchor);
      }
    });

    track.style.setProperty('--zoom', zoom);
    syncZoomUI();

    function drawEvents(events) {
      const starts = events.map((event) => Date.parse(event.start.at));
      const ends = events.map((event) => (event.end ? Date.parse(event.end.at) : null));
      const start = Math.min(...starts);
      const end = Math.max(...starts, ...ends.filter((time) => time !== null));
      const position = (time) => (end === start ? 50 : ((time - start) / (end - start)) * 100);
      labelTargets = [];

      // Bars first, so dots render on top of them.
      events.forEach((event, index) => {
        if (!event.end) {
          return;
        }
        const bar = document.createElement('div');
        bar.className = 'event-bar';
        bar.setAttribute('aria-hidden', 'true');
        bar.style.setProperty('--pos', `${position(starts[index])}%`);
        bar.style.setProperty('--end-pos', `${position(ends[index])}%`);
        if (event.style && event.style.color) {
          bar.style.background = event.style.color;
        }
        bar.addEventListener('click', () => zoomToEvent(position(starts[index]) / 100, position(ends[index]) / 100));
        track.appendChild(bar);
        labelTargets.push({ event, frac: (position(starts[index]) + position(ends[index])) / 2, startFrac: position(starts[index]) / 100, endFrac: position(ends[index]) / 100 });
      });

      events.forEach((event, index) => {
        if (event.end) {
          return;
        }
        const dot = document.createElement('div');
        dot.className = 'event-dot';
        dot.setAttribute('aria-hidden', 'true');
        dot.style.setProperty('--pos', `${position(starts[index])}%`);
        if (event.style && event.style.color) {
          dot.style.background = event.style.color;
        }
        track.appendChild(dot);
        labelTargets.push({ event, frac: position(starts[index]) });
      });
    }

    // Labels: one small box per event, title plus the first few words
    // of its description, floating above or below the line. There is
    // only room for some of them, so each label is placed greedily in
    // time order into the first of two lanes (above, then below) where
    // it fits without overlapping a label already there; the rest are
    // suppressed. Placement depends on pixel widths, so it is redone
    // whenever the zoom or the window size changes.
    function layoutLabels() {
      track.querySelectorAll('.event-label').forEach((label) => label.remove());
      if (!labelTargets.length) {
        return;
      }
      const landscape = window.matchMedia('(orientation: landscape)').matches;
      const trackLength = landscape ? track.offsetWidth : track.offsetHeight;
      const GAP = 4;
      const lanes = [[], []];

      labelTargets.forEach(({ event, frac, startFrac, endFrac }) => {
        const label = document.createElement('div');
        label.className = 'event-label';
        label.setAttribute('aria-hidden', 'true');
        const title = document.createElement('div');
        title.className = 'event-label-title';
        title.textContent = event.title;
        label.appendChild(title);
        if (event.description) {
          const words = event.description.split(/\s+/);
          const excerpt = document.createElement('div');
          excerpt.className = 'event-label-excerpt';
          excerpt.textContent = words.slice(0, 8).join(' ') + (words.length > 8 ? '…' : '');
          label.appendChild(excerpt);
        }
        label.style.setProperty('--pos', `${frac}%`);
        track.appendChild(label);
        // A duration event's label is clickable too, and snaps the
        // zoom the same way its bar does. Other labels stay
        // click-through (see .event-label), so they never swallow a
        // click meant for something beneath them.
        if (event.end) {
          label.style.pointerEvents = 'auto';
          label.style.cursor = 'pointer';
          label.addEventListener('click', () => zoomToEvent(startFrac, endFrac));
        }
        const size = landscape ? label.offsetWidth : label.offsetHeight;
        const centre = (frac / 100) * trackLength;
        const interval = [centre - size / 2 - GAP, centre + size / 2 + GAP];
        const lane = lanes.findIndex((placed) => placed.every(([from, to]) => interval[1] <= from || interval[0] >= to));
        if (lane === -1) {
          label.remove();
          return;
        }
        lanes[lane].push(interval);
        label.classList.add(lane === 0 ? 'label-above' : 'label-below');
      });
    }

    window.addEventListener('resize', () => layoutLabels());

    console.log('Loading timeline…');

    fetchTimeline(TIMELINE_URL)
      .then((data) => {
        timeline = data;
        console.log('Loaded timeline:', data.title, `(${data.events.length} events)`);
        drawEvents(data.events);
        layoutLabels();
      })
      .catch((error) => {
        console.error('Could not load timeline:', error);
      });
  </script>
</body>
</html>
