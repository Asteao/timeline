<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline</title>
  <style>
    body {
      margin: 0;
      background: #fff;
      min-height: 100vh;
      display: flex;
      align-items: safe center;
      justify-content: safe center;
      overflow: auto;
    }

    .zoom-controls {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.5rem;
    }

    .zoom-controls button {
      width: 2rem;
      height: 2rem;
      font-size: 1.1rem;
      line-height: 1;
      background: #fff;
      border: 1px solid #000;
      border-radius: 4px;
      cursor: pointer;
    }

    .zoom-controls button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .timeline-track {
      position: relative;
      /* No shrinking: the track is a flex item of body, and the default
         flex-shrink: 1 squeezed a zoomed track back to the viewport width,
         so zoom past the first step had no visible effect. */
      flex: 0 0 auto;
    }

    .timeline-line {
      background: #000;
    }

    .event-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #000;
    }

    .event-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
    }

    /* Wider than tall: horizontal line, dots positioned left to right. */
    @media (orientation: landscape) {
      .timeline-track {
        width: calc(80% * var(--zoom, 1));
        height: 12px;
        display: flex;
        align-items: center;
      }

      .timeline-line {
        width: 100%;
        height: 2px;
      }

      .event-dot {
        left: var(--pos);
        top: 50%;
        transform: translate(-50%, -50%);
      }
    }

    /* Taller than wide: vertical line, dots positioned top to bottom. */
    @media (orientation: portrait) {
      .timeline-track {
        width: 12px;
        height: calc(80vh * var(--zoom, 1));
        display: flex;
        justify-content: center;
      }

      .timeline-line {
        width: 2px;
        height: 100%;
      }

      .event-dot {
        top: var(--pos);
        left: 50%;
        transform: translate(-50%, -50%);
      }
    }
  </style>
</head>
<body>
  <div class="zoom-controls">
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="zoom-out" type="button" aria-label="Zoom out">-</button>
  </div>

  <div class="timeline-track">
    <div class="timeline-line" aria-hidden="true"></div>
  </div>

  <script>
    const TIMELINE_URL = 'https://timeline.asteao.net/timelines/starship-flight-15.json';

    let timeline = null;

    async function fetchTimeline(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Failed to fetch timeline: ${response.status}`);
      }

      const data = await response.json();

      if (data.schema_version !== 1 || !Array.isArray(data.events)) {
        throw new Error('Not a timeline file (expected schema_version 1 and an events array).');
      }

      return data;
    }

    const track = document.querySelector('.timeline-track');

    let zoom = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 8;

    const zoomInButton = document.getElementById('zoom-in');
    const zoomOutButton = document.getElementById('zoom-out');

    function applyZoom() {
      track.style.setProperty('--zoom', zoom);
      zoomInButton.disabled = zoom >= MAX_ZOOM;
      zoomOutButton.disabled = zoom <= MIN_ZOOM;
      console.log('Zoom:', `${zoom}x`);
    }

    zoomInButton.addEventListener('click', () => {
      if (zoom < MAX_ZOOM) {
        zoom *= 2;
        applyZoom();
      }
    });

    zoomOutButton.addEventListener('click', () => {
      if (zoom > MIN_ZOOM) {
        zoom /= 2;
        applyZoom();
      }
    });

    applyZoom();

    function drawDots(events) {
      const times = events.map((event) => Date.parse(event.start.at));
      const start = Math.min(...times);
      const end = Math.max(...times);

      events.forEach((event, index) => {
        const dot = document.createElement('div');
        dot.className = 'event-dot';
        dot.setAttribute('aria-hidden', 'true');
        const position = end === start ? 50 : ((times[index] - start) / (end - start)) * 100;
        dot.style.setProperty('--pos', `${position}%`);
        track.appendChild(dot);
      });
    }

    console.log('Loading timeline…');

    fetchTimeline(TIMELINE_URL)
      .then((data) => {
        timeline = data;
        console.log('Loaded timeline:', data.title, `(${data.events.length} events)`);
        drawDots(data.events);
      })
      .catch((error) => {
        console.error('Could not load timeline:', error);
      });
  </script>
</body>
</html>
