<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline</title>
  <style>
    /* No overscroll navigation: without this, scrolling past the left
       end of the timeline on a Mac trackpad makes Chrome swipe back
       to the previous page. */
    html,
    body {
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      background: #fff;
      min-height: 100vh;
      display: flex;
      align-items: safe center;
      justify-content: safe center;
      overflow: auto;
    }

    .zoom-controls {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.5rem;
    }

    .zoom-controls button {
      width: 2rem;
      height: 2rem;
      font-size: 1.1rem;
      line-height: 1;
      background: #fff;
      border: 1px solid #000;
      border-radius: 4px;
      cursor: pointer;
    }

    .zoom-controls button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* Experiment: slider zoom control, fixed at the bottom centre. */
    .zoom-slider {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      align-items: center;
      background: #fff;
      border: 1px solid #000;
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
    }

    .zoom-slider input {
      width: 10rem;
    }

    .zoom-slider span {
      font-size: 0.9rem;
      min-width: 2.5rem;
      text-align: right;
    }

    .timeline-track {
      position: relative;
      /* No shrinking: the track is a flex item of body, and the default
         flex-shrink: 1 squeezed a zoomed track back to the viewport width,
         so zoom past the first step had no visible effect. */
      flex: 0 0 auto;
    }

    /* Fixed padding at both ends of the timeline, in viewport units so
       it does not grow with zoom. These are real elements, not margins:
       a trailing margin is dropped from the scrollable area, so the
       far end used to sit flush against the screen edge when zoomed in.
       At 1x the pads (10vw each) plus the track (80%) are exactly the
       viewport width, so the 1x look is unchanged. */
    .timeline-pad {
      flex: 0 0 auto;
    }

    .timeline-line {
      background: #000;
    }

    .event-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #000;
    }

    .event-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
    }

    /* Wider than tall: horizontal line, dots positioned left to right. */
    @media (orientation: landscape) {
      body {
        flex-direction: row;
      }

      .timeline-pad {
        width: 10vw;
        height: 12px;
      }

      .timeline-track {
        width: calc(80% * var(--zoom, 1));
        height: 12px;
        display: flex;
        align-items: center;
      }

      .timeline-line {
        width: 100%;
        height: 2px;
      }

      .event-dot {
        left: var(--pos);
        top: 50%;
        transform: translate(-50%, -50%);
      }
    }

    /* Taller than wide: vertical line, dots positioned top to bottom. */
    @media (orientation: portrait) {
      body {
        flex-direction: column;
      }

      .timeline-pad {
        width: 12px;
        height: 10vh;
      }

      .timeline-track {
        width: 12px;
        height: calc(80vh * var(--zoom, 1));
        display: flex;
        justify-content: center;
      }

      .timeline-line {
        width: 2px;
        height: 100%;
      }

      .event-dot {
        top: var(--pos);
        left: 50%;
        transform: translate(-50%, -50%);
      }
    }
  </style>
</head>
<body>
  <div class="zoom-controls">
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="zoom-out" type="button" aria-label="Zoom out">-</button>
  </div>

  <!-- Experiment: slider zoom control. -->
  <div class="zoom-slider">
    <input id="zoom-slider" type="range" min="0" max="7" step="1" value="0" aria-label="Zoom level">
    <span id="zoom-label">1x</span>
  </div>

  <div class="timeline-pad" aria-hidden="true"></div>
  <div class="timeline-track">
    <div class="timeline-line" aria-hidden="true"></div>
  </div>
  <div class="timeline-pad" aria-hidden="true"></div>

  <script>
    const TIMELINE_URL = 'https://timeline.asteao.net/timelines/starship-flight-15.json';

    let timeline = null;

    async function fetchTimeline(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Failed to fetch timeline: ${response.status}`);
      }

      const data = await response.json();

      if (data.schema_version !== 1 || !Array.isArray(data.events)) {
        throw new Error('Not a timeline file (expected schema_version 1 and an events array).');
      }

      return data;
    }

    const track = document.querySelector('.timeline-track');

    let zoom = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 128;

    const zoomInButton = document.getElementById('zoom-in');
    const zoomOutButton = document.getElementById('zoom-out');
    const zoomSlider = document.getElementById('zoom-slider');
    const zoomLabel = document.getElementById('zoom-label');

    function applyZoom() {
      track.style.setProperty('--zoom', zoom);
      zoomInButton.disabled = zoom >= MAX_ZOOM;
      zoomOutButton.disabled = zoom <= MIN_ZOOM;
      zoomSlider.value = String(Math.log2(zoom));
      zoomLabel.textContent = `${zoom}x`;
      console.log('Zoom:', `${zoom}x`);
    }

    function setZoom(newZoom) {
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newZoom));
      applyZoom();
    }

    function zoomIn() {
      setZoom(zoom * 2);
    }

    function zoomOut() {
      setZoom(zoom / 2);
    }

    // Baseline method: + / - buttons.
    zoomInButton.addEventListener('click', zoomIn);
    zoomOutButton.addEventListener('click', zoomOut);

    // Experiment: slider, log scale, one step per notch (1x to 128x).
    zoomSlider.addEventListener('input', () => {
      setZoom(2 ** Number(zoomSlider.value));
    });

    // Experiment: scroll up to zoom in, scroll down to zoom out.
    // A mostly-horizontal swipe is panning, so it is left alone.
    // Wheel events arrive in small increments on a trackpad, so they
    // are accumulated until they add up to one step.
    let wheelAccum = 0;
    window.addEventListener('wheel', (event) => {
      if (Math.abs(event.deltaX) > Math.abs(event.deltaY)) {
        return;
      }
      event.preventDefault();
      wheelAccum += event.deltaY;
      if (wheelAccum <= -100) {
        zoomIn();
        wheelAccum = 0;
      } else if (wheelAccum >= 100) {
        zoomOut();
        wheelAccum = 0;
      }
    }, { passive: false });

    // Experiment: keyboard, + / - to zoom, 0 to reset.
    window.addEventListener('keydown', (event) => {
      if (event.key === '+' || event.key === '=') {
        zoomIn();
      } else if (event.key === '-' || event.key === '_') {
        zoomOut();
      } else if (event.key === '0') {
        setZoom(1);
      }
    });

    // Experiment: double-click the timeline to zoom in,
    // Shift+double-click to zoom out.
    track.addEventListener('dblclick', (event) => {
      if (event.shiftKey) {
        zoomOut();
      } else {
        zoomIn();
      }
    });

    applyZoom();

    function drawDots(events) {
      const times = events.map((event) => Date.parse(event.start.at));
      const start = Math.min(...times);
      const end = Math.max(...times);

      events.forEach((event, index) => {
        const dot = document.createElement('div');
        dot.className = 'event-dot';
        dot.setAttribute('aria-hidden', 'true');
        const position = end === start ? 50 : ((times[index] - start) / (end - start)) * 100;
        dot.style.setProperty('--pos', `${position}%`);
        track.appendChild(dot);
      });
    }

    console.log('Loading timeline…');

    fetchTimeline(TIMELINE_URL)
      .then((data) => {
        timeline = data;
        console.log('Loaded timeline:', data.title, `(${data.events.length} events)`);
        drawDots(data.events);
      })
      .catch((error) => {
        console.error('Could not load timeline:', error);
      });
  </script>
</body>
</html>
